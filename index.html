      <div class="login-actions">
        <div class="login-accept">
          <label class="accept-check" for="login-consent">
            <input id="login-consent" type="checkbox" required aria-labelledby="consent-text">
            <span class="accept-dot" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></span>
          </label>
          <div class="accept-copy">
            <label id="consent-text" for="login-consent">Concordo com os Termos de Uso, reconheço a Política de Privacidade e confirmo que tenho pelo menos 18 anos.</label>
            <div class="accept-links"><a href="termos.html">Termos de Uso</a><a href="privacidade.html">Política de Privacidade</a></div>
          </div>
        </div>
        <fieldset class="login-gate" id="login-gate" aria-label="Entrar na sua conta" disabled>
        <button type="button" class="google-button" id="google-login" aria-describedby="login-message" disabled>
          <img src="assets/google-g.png" width="20" height="20" alt="">
          <span id="google-login-label">Continuar com o Google</span>
        </button>
        <div class="login-divider" id="email-divider"><span>ou</span></div>
        <form class="email-login" id="email-login" novalidate>
          <label for="login-email">E-mail</label>
          <input id="login-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="voce@exemplo.com" required>
          <button type="submit" class="email-button" id="email-send">Enviar código</button>
        </form>
        <form class="email-login" id="code-login" novalidate hidden>
          <label for="login-code">Código enviado para <span id="code-email"></span></label>
          <input id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="0000 0000" required>
          <button type="submit" class="email-button" id="code-submit">Entrar</button>
          <div class="code-links"><button type="button" class="link-button" id="code-resend">Reenviar código</button><button type="button" class="link-button" id="code-change">Trocar e-mail</button></div>
        </form>
        </fieldset>
        <p class="login-message" id="login-message" role="status" aria-live="polite">Verificando seu acesso…</p>
