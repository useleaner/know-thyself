<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script>try{var l=localStorage.getItem('know-thyself.lang');if(l==='en'||(l!=='pt-BR'&&!/^pt\b/i.test(navigator.language||'pt')))document.documentElement.classList.add('i18n-pending')}catch(e){}</script>
  <style>.i18n-pending main{visibility:hidden;animation:i18n-show 0s 3s forwards}@keyframes i18n-show{to{visibility:visible}}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080d23">
  <title>Perfil — Know Thyself</title>
  <link rel="stylesheet" href="style.css?v=20261020-veu4">
  <link rel="stylesheet" href="profiles.css?v=20261020-veu4">
<script>addEventListener('gesturestart',e=>e.preventDefault())</script>
</head>
<body class="profile-workspace">
  <div class="atmosphere" aria-hidden="true">
    <div class="nebula nebula-far"></div>
    <div class="nebula nebula-near"></div>
  </div>
  <main class="profile-page">
    <a id="profile-back" class="back-link icon-back" href="./universo.html" aria-label="Voltar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>

    <div id="profile-hub" class="profile-view">
      <h1>Perfil</h1>
      <section id="profile-summary" class="profile-summary" aria-label="Perfil ativo">
        <a id="active-profile" class="active-profile"></a>
        <div id="profile-actions" class="profile-actions">
          <a id="edit-active-profile" class="profile-action" href="./perfil.html?view=edit">Editar dados</a>
          <a id="switch-profile" class="profile-action" href="./perfil.html?view=profiles">Trocar perfil</a>
        </div>
      </section>
      <section id="profile-comparison" class="profile-comparison" hidden>
        <label class="profile-field" for="profile-partner">Comparar com
          <select id="profile-partner"><option value="">Escolha uma pessoa</option></select>
        </label>
      </section>
      <p id="profile-hub-status" class="profile-feedback" role="status" aria-live="polite"></p>
      <footer class="profile-account">
        <p id="profile-email" hidden></p>
        <button type="button" class="profile-action logout-profile" data-auth-logout>Sair</button>
        <p id="account-status" class="profile-feedback" role="status" aria-live="polite"></p>
        <nav class="profile-legal" aria-label="Informações legais"><a href="./termos.html">Termos</a><span aria-hidden="true">·</span><a href="./privacidade.html">Privacidade</a><span aria-hidden="true">·</span><a href="https://github.com/defiphill/know-thyself" rel="noopener">Código-fonte</a></nav>
      </footer>
    </div>

    <div id="profiles-view" class="profile-view" hidden>
      <h1>Dados de nascimento</h1>
      <p class="profile-intro">Cadastre você e as pessoas que quer conhecer melhor.</p>
      <section class="saved-profiles" aria-labelledby="saved-title">
        <h2 id="saved-title">Perfis salvos</h2>
        <div id="profile-list"></div>
      </section>
      <p id="profiles-status" class="profile-feedback" role="status" aria-live="polite"></p>
      <a id="new-profile" class="save-profile new-profile" href="./perfil.html?view=new">Novo perfil</a>
    </div>

    <div id="profile-form-view" class="profile-view" hidden>
      <h1 id="form-title">Novo perfil</h1>
      <form id="birth-form" aria-labelledby="form-title">
        <label class="profile-field" for="birth-name">Nome completo
          <input id="birth-name" name="name" autocomplete="name" required maxlength="120">
        </label>
        <div class="birth-fields">
          <label class="profile-field" for="birth-date">Data de nascimento
            <input id="birth-date" name="birthDate" type="text" inputmode="numeric" autocomplete="bday" placeholder="dd/mm/aaaa" maxlength="10" pattern="\d{2}/\d{2}/\d{4}" required>
          </label>
          <label class="profile-field" for="birth-time">Hora de nascimento
            <input id="birth-time" name="birthTime" type="text" inputmode="numeric" placeholder="hh:mm" maxlength="5" pattern="\d{2}:\d{2}" required>
          </label>
          <label class="unknown-time-chip" for="time-unknown">
            <input id="time-unknown" name="timeUnknown" type="checkbox">
            <span class="unknown-time-dot" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></svg></span>
            Não sei o horário
          </label>
        </div>
        <label class="profile-field" for="birth-place">Cidade, estado e país de nascimento
          <span class="combo">
            <input id="birth-place" name="place" required maxlength="240" placeholder="Ex.: Curitiba" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="place-list" aria-describedby="place-state">
            <svg class="place-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11Z"/><circle cx="12" cy="10" r="2"/></svg>
          </span>
        </label>
        <ul id="place-list" role="listbox" aria-label="Sugestões de cidade" hidden></ul>
        <p id="place-state" class="field-help" role="status" aria-live="polite"></p>
      </form>
      <div class="profile-form-footer">
        <button class="save-profile" type="submit" form="birth-form">Salvar dados</button>
        <a id="cancel-edit" class="profile-action" href="./perfil.html" hidden>Cancelar edição</a>
        <button id="delete-profile" class="delete-profile" type="button" hidden>Excluir este perfil</button>
      </div>
    </div>
    <p id="profile-status" class="profile-feedback" role="status" aria-live="polite"></p>
    <noscript>Ative o JavaScript para abrir seus perfis.</noscript>
  </main>
  <script type="module" src="profile-form.js?v=20261019-hub"></script>
</body>
</html>
