<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d23">
  <meta name="robots" content="noindex,nofollow">
  <title>Sem conexão — Know Thyself</title>
  <style>
    :root{color-scheme:dark;font-family:Space,system-ui,sans-serif;color:#f3edf9;background:#080d23}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px}
    main{max-width:26rem;text-align:center}svg{width:64px;height:112px;color:#e2def2;margin-bottom:24px}
    h1{font-size:28px;line-height:1.2;letter-spacing:-.025em;margin:0 0 16px}p{font-size:16px;line-height:1.6;color:#d7d4ed;margin:0 0 28px}
    button{min-height:48px;padding:12px 24px;border:1px solid #f0caa1;border-radius:12px;background:#f0caa1;color:#080d23;font:inherit;font-size:16px;font-weight:500;line-height:1.4;cursor:pointer}
    button:hover{background:#f8e6c7}button:focus-visible{outline:2px solid #f3edf9;outline-offset:5px}
    ::selection{background:#f0caa1;color:#080d23}
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 80 140" aria-label="Know Thyself" role="img"><g fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="40" cy="40" r="30"/><circle cx="40" cy="70" r="30"/><circle cx="40" cy="100" r="30"/></g><circle cx="40" cy="70" r="4.6" fill="#f0caa1"/></svg>
    <h1>Você está sem conexão</h1>
    <p>Confira a internet e tente novamente.</p>
    <button type="button">Tentar novamente</button>
  </main>
  <script>
    let language;
    try { language = localStorage.getItem('know-thyself.lang'); } catch {}
    const english = language === 'en' || (language !== 'pt-BR' && !/^pt\b/i.test(navigator.language || 'pt'));
    if (english) {
      document.documentElement.lang = 'en';
      document.title = 'No connection — Know Thyself';
      document.querySelector('h1').textContent = 'You are offline';
      document.querySelector('p').textContent = 'Check your internet connection and try again.';
      document.querySelector('button').textContent = 'Try again';
    }
    document.querySelector('button').addEventListener('click', () => {
      if (location.pathname.endsWith('/offline.html')) location.replace('./universo.html');
      else location.reload();
    });
  </script>
</body>
</html>
